<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | Page Not Found | FenceForge</title>

  <meta
    name="description"
    content="The page you're looking for could not be found. Return to FenceForge or explore our fencing products."
  >

  <link rel="icon" type="image/png" href="images/logo img.png">
  <link rel="stylesheet" href="404.css">
</head>

<body>

  <div class="page-controls">

    <button
      class="control-btn"
      id="rtlToggle"
      type="button"
      aria-label="Toggle text direction"
    >
      <i data-lucide="align-right"></i>
    </button>

    <button
      class="control-btn"
      id="darkToggle"
      type="button"
      aria-label="Toggle dark mode"
    >
      <i data-lucide="moon"></i>
    </button>

  </div>

  <section class="error-page">

    <div class="error-content">

      <div class="error-icon">
        <i data-lucide="file-x-2"></i>
      </div>

      <div class="error-number">
        404
      </div>

      <h1 class="error-title">
        Page Not <span>Found</span>
      </h1>

      <p class="error-description">
        The page you're looking for doesn't exist or may have been moved.
        Let's get you back to the right place.
      </p>

      <div class="error-actions">

        <a href="index.html" class="btn btn-primary">
          <i data-lucide="house"></i>
          <span>Go to Home</span>
        </a>

        <a href="product.html" class="btn btn-secondary">
          <span>Browse Products</span>
          <i data-lucide="arrow-up-right"></i>
        </a>

      </div>

      <div class="error-help">
        <span></span>

        <p>
          Need help?
          <a href="contact.html">Contact FenceForge</a>
        </p>

        <span></span>
      </div>

    </div>

    <div class="error-decoration" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

  </section>

  <script src="https://unpkg.com/lucide@0.542.0/dist/umd/lucide.min.js"></script>
  <script src="404.js"></script>

</body>
</html>
